<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trajectory – Contact</title>
   <link rel="icon" type="image/png" href="logo.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

   body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  background: #FFFFFF;
  color: #1A1A1A;
}

    /* NAV ── identical to homepage */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: #FFFFFF;
      border-bottom: 1px solid #E8E8E8;
      z-index: 100;
    }

    .nav-inner {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 100px;        /* consistent spacing */
  padding: 0 8px;
  position: relative;
}

    .nav-link {
  padding: 14px 6px;
  font-size: 13px;

  font-weight: 500;
  color: #8A8A8A;
  text-decoration: none;
  letter-spacing: 0.3px;
  position: relative;
 line-height: 1; 
}

    .nav-link.active {
      color: #1A1A1A;
      font-weight: 700;
    }

    .underline {
      position: absolute;
      bottom: 0;
      height: 2.5px;
      background: #D72638;
      border-radius: 2px;
      transition: left 0.3s ease-in-out, width 0.3s ease-in-out;
    }

    /* CONTACT SECTION – adjusted to match Hero/About sizes */
    .contact {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 100px 32px 40px; /* top and horizontal match Hero/About */
      text-align: center;
    }

    .contact-inner {
      max-width: 720px; /* match Hero/About */
      width: 100%;
    }

    .contact-title {
      font-size: 64px; /* match Hero/About */
      font-weight: 800;
      letter-spacing: -1.8px;
      color: #1A1A1A;
      margin-bottom: 48px;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }

    .contact-title.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .contact-text {
      font-size: 18px;
      line-height: 1.7;
      color: #4A4A4A;
      text-align: center;
      max-width: 680px;
    }

    .contact-text p {
      margin-bottom: 28px;
      opacity: 0;
      transform: translateY(15px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .contact-text p.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Clickable links styling – consistent with your red theme */
    .contact-email,
    .contact-website {
      color: #D72638;
      font-weight: 600;
      text-decoration: none;
      transition: color 0.2s;
    }

    .contact-email:hover,
    .contact-website:hover {
      color: #b91c2c;
      text-decoration: underline;
    }

.nav-link {
  padding: 14px 6px;
  font-size: 13px;
  font-weight: 500;
  color: #8A8A8A;
  text-decoration: none;
  letter-spacing: 0.3px; /* match About/Home */
          /* force consistent height */
  position: relative;
  transition: color 0.2s;
}

    /* MOBILE */
    @media (max-width: 480px) {
      .contact {
        padding: 90px 20px 40px;
      }
      .contact-title {
        font-size: 48px;
      }
      .contact-text {
        font-size: 16px;
      }
      .nav-link {
        font-size: 12px;
        padding: 12px 4px;
      }
.nav-inner {
  gap: 18px;
}
    }
  </style>
</head>
<body>

<nav>
  <div class="nav-inner" id="navInner">
    <a href="index.html" class="nav-link">Home</a>
    <a href="about.html" class="nav-link">About</a>
    <a href="missions.html" class="nav-link">Missions</a>
    <a href="library.html" class="nav-link">Library</a>
    <a href="contact.html" class="nav-link active">Contact</a>
    <div class="underline" id="underline"></div>
  </div>
</nav>

<section class="contact">
  <div class="contact-inner">
    <div class="contact-title" id="contactTitle">Contact</div>

    <div class="contact-text" id="contactText">
      <p>If you have any questions about Trajectory or aerospace physics, feel free to contact me at 
        <a href="mailto:muzaffaraylin@gmail.com" class="contact-email">muzaffaraylin@gmail.com</a>
      </p>
      <p>You can find more information about me and my work on my personal website: 
        <a href="https://aylinmuzaffarli.com" target="_blank" rel="noopener noreferrer" class="contact-website">aylinmuzaffarli.com</a>
      </p>
    </div>
  </div>
</section>

<script>
  // Underline movement – identical to homepage
  const links = document.querySelectorAll('.nav-link');
  const underline = document.getElementById('underline');

  function moveUnderline(el) {
  if (!el) return;
  underline.style.left = el.offsetLeft + "px";
  underline.style.width = el.offsetWidth + "px";
}

  links.forEach(link => {
    link.addEventListener('click', (e) => {
      links.forEach(l => l.classList.remove('active'));
      link.classList.add('active');
      moveUnderline(link);
    });
  });

  window.addEventListener('load', () => {
    const active = document.querySelector('.nav-link.active');
    if (active) moveUnderline(active);

    // Fade in title + staggered paragraphs
    setTimeout(() => {
      document.getElementById('contactTitle').classList.add('visible');
    }, 400);

    const paragraphs = document.querySelectorAll('.contact-text p');
    paragraphs.forEach((p, i) => {
      setTimeout(() => {
        p.classList.add('visible');
      }, 800 + i * 220);
    });
  });

  window.addEventListener('resize', () => {
    const active = document.querySelector('.nav-link.active');
    if (active) moveUnderline(active);
  });
</script>

</body>
</html>
