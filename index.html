<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trajectory</title>
  <link rel="icon" type="image/x-icon" href="./favicon.ico">
  
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  background: #FFFFFF;
  color: #1A1A1A;
}

/* NAV */
nav {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  background: #FFFFFF;
  border-bottom: 1px solid #E8E8E8;
  z-index: 100;
}

.nav-inner {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 100px;        /* consistent spacing */
  padding: 0 8px;
  position: relative;
}

.nav-link {
  padding: 14px 6px;
  font-size: 13px;
  font-weight: 500;
  color: #8A8A8A;
  text-decoration: none;
  letter-spacing: 0.3px;
  transition: color 0.2s;
  position: relative;
line-height: 1;
}

.nav-link.active {
  color: #1A1A1A;
  font-weight: 700;
}

.underline {
  position: absolute;
  bottom: 0;
  height: 2.5px;
  background: #D72638;
  border-radius: 2px;
  transition: left 0.3s ease-in-out, width 0.3s ease-in-out;
}

/* HERO (adjusted to match About sizes) */
.hero {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 100px 32px 40px; /* adjusted from 32px → 100px top to match About */
  text-align: center;
}

.hero-inner {
  max-width: 720px; /* adjusted from 600px → 720px to match About */
}

.hero-title {
  font-size: 64px; /* adjusted from 88px → 64px to match About */
  font-family: 'Futura Extra Bold', sans-serif;
  font-weight: 800;
  letter-spacing: -1.5px;
  color: #1A1A1A;
  display: inline-block;
  white-space: nowrap;
}

.hero-title .letter {
  opacity: 0;
  display: inline-block;
  transition: opacity 0.3s ease;
}

.hero-subtext {
  font-size: 20px;
  line-height: 28px;
  color: #4A4A4A;
  margin-top: 20px;
  padding: 0 8px;
  opacity: 0;
  transition: opacity 0.6s ease;
}

.hero-subtext.visible { opacity: 1; }

.cta-wrap {
  margin-top: 32px;
  opacity: 0;
  transition: opacity 0.6s ease;
}

.cta-wrap.visible { opacity: 1; }

.cta-button {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #D72638;
  color: #FFFFFF;
  padding: 14px 24px;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.2px;
  text-decoration: none;
  border: none;
  cursor: pointer;
  transition: opacity 0.2s;
}

.cta-button:hover { opacity: 0.85; }

.cta-button svg { width: 18px; height: 18px; }

@media (max-width: 480px) {
  .hero-title { font-size: 48px; }
  .nav-link { font-size: 12px; padding: 12px 4px; }

.nav-inner {
  gap: 18px;
}
}
</style>
</head>

<body>

<nav>
  <div class="nav-inner" id="navInner">
    <a href="index.html" class="nav-link active">Home</a>
    <a href="about.html" class="nav-link">About</a>
    <a href="missions.html" class="nav-link">Missions</a>
    <a href="library.html" class="nav-link">Library</a>
    <a href="contact.html" class="nav-link">Contact</a>
    <div class="underline" id="underline"></div>
  </div>
</nav>

<section class="hero">
  <div class="hero-inner">
    <div class="hero-title" id="heroTitle"></div>
    <p class="hero-subtext" id="heroSubtext">
      Trajectory lets you calculate rocket missions with precise physics. Explore propulsion, &Delta;v, and acceleration with tools and reference materials.
    </p>
    <div class="cta-wrap" id="ctaWrap">
      <a href="about.html" class="cta-button">
        More
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </a>
    </div>
  </div>
</section>

<script>
const title = 'Trajectory';
const container = document.getElementById('heroTitle');
let i = 0;

function typeLetter() {
  if (i < title.length) {
    const span = document.createElement('span');
    span.className = 'letter';
    span.textContent = title[i];
    container.appendChild(span);
    requestAnimationFrame(() => { span.style.opacity = '1'; });
    i++;
    setTimeout(typeLetter, 100);
  } else {
    document.getElementById('heroSubtext').classList.add('visible');
    setTimeout(() => {
      document.getElementById('ctaWrap').classList.add('visible');
    }, 300);
  }
}
setTimeout(typeLetter, 400);

const links = document.querySelectorAll('.nav-link');
const underline = document.getElementById('underline');

function moveUnderline(el) {
  if (!el) return;
  underline.style.left = el.offsetLeft + "px";
  underline.style.width = el.offsetWidth + "px";
}
links.forEach(link => {
  link.addEventListener('click', () => {
    links.forEach(l => l.classList.remove('active'));
    link.classList.add('active');
    moveUnderline(link);
  });
});

window.addEventListener('load', () => {
  const active = document.querySelector('.nav-link.active');
  if (active) moveUnderline(active);

  // Fade in title + staggered paragraphs (none here for hero)
});

window.addEventListener('resize', () => {
  const active = document.querySelector('.nav-link.active');
  if (active) moveUnderline(active);
});
</script>

</body>
</html>
